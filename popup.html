<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
    body {
        width: 270px;
        margin: 0;
        padding: 16px;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
    }

    h2 {
        margin: 0 0 12px;
        font-size: 17px;
    }

    .counter {
        background: #1b1b1b;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 14px;
        text-align: center;
    }

    .counter-label {
        color: #aaa;
        font-size: 11px;
    }

    .counter-number {
        font-size: 28px;
        font-weight: bold;
        margin-top: 3px;
    }

    .mode {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #333;
        background: #1b1b1b;
        color: white;
        padding: 11px;
        margin: 7px 0;
        border-radius: 8px;
        cursor: pointer;
        text-align: left;
    }

    .mode:hover {
        background: #292929;
    }

    .mode.active {
        border-color: #fff;
        background: #303030;
    }

    .title {
        font-weight: bold;
        font-size: 14px;
    }

    .desc {
        color: #aaa;
        font-size: 11px;
        margin-top: 4px;
        line-height: 1.3;
    }

    .reset {
        width: 100%;
        margin-top: 10px;
        padding: 8px;
        border: 1px solid #333;
        border-radius: 7px;
        background: #151515;
        color: #aaa;
        cursor: pointer;
    }

    .reset:hover {
        background: #252525;
        color: white;
    }
</style>
</head>

<body>

<h2>YouTube Ad Control</h2>

<div class="counter">
    <div class="counter-label">ADS KILLED</div>
    <div class="counter-number" id="adsKilled">0</div>
</div>

<button class="mode" data-mode="auto_skip">
    <div class="title">🟢 Auto Skip</div>
    <div class="desc">
        Automatically clicks Skip when available.
    </div>
</button>

<button class="mode" data-mode="ad_killer">
    <div class="title">🔴 Ad Killer</div>
    <div class="desc">
        Ends the ad when YouTube starts playing it.
    </div>
</button>

<button class="mode" data-mode="ultimate">
    <div class="title">⚡ Ultimate</div>
    <div class="desc">
        Detects known ad breaks early and bypasses them.
    </div>
</button>

<button class="reset" id="resetCounter">
    Reset Counter
</button>

<script src="popup.js"></script>

</body>
</html>
